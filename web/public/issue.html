<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整期编排 · 书页</title><link rel="stylesheet" href="./issue.css"></head><body><main><header><a href="./">← 项目库</a><h1>整期编排</h1><p>选择已排版的文章，确认顺序，生成目录、连续页码和可编辑 Word。</p></header><div id="status" role="status" aria-live="polite">正在读取工程…</div><section><h2>整期方案</h2><label>已保存方案<select id="issues"><option value="">新建方案</option></select></label><label>刊期名称<input id="title" value="整期校样" maxlength="120"></label><div class="fields"><label>正文起始页<input id="firstPage" type="number" min="1" max="9000" value="1"></label><label>成品宽 mm<input id="width" type="number" min="100" max="320" value="210"></label><label>成品高 mm<input id="height" type="number" min="140" max="450" value="285"></label></div><p id="revision">尚未保存</p><label>历史方案<select id="history"><option value="">选择历史方案预览</option></select></label><button id="save">保存方案</button> <button id="generate" class="primary">生成整期校样</button> <button id="resume">取回上次任务</button></section><div class="columns"><section><h2>文章工程</h2><p>来源需已应用期刊模板。加入后记录当前修订；源稿修改后请重新加入以更新绑定。</p><div id="projects"></div></section><section><h2>刊载顺序</h2><p>使用上移、下移调整顺序，目录与页码将随最终排版重算。</p><ol id="articles"></ol></section></div><section id="delivery" hidden><h2>校样与下载</h2><p id="quality"></p><div id="downloads"></div><table><thead><tr><th>文章</th><th>页码</th><th>检查结果</th></tr></thead><tbody id="contents"></tbody></table><details><summary>质量报告</summary><pre id="report"></pre></details></section></main><script type="module" src="./issue.mjs"></script></body></html>
